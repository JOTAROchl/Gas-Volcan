<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | Gas El Volcán</title>
<link rel="stylesheet" href="../css/EstiloPaginaGEV.css">
</head>
<body>
<header class="site-header">
<nav class="navbar container">
<a class="brand" href="InicioPagina.html">
<img src="../img/logoMasNombreGEV.jpg" alt="Gas El Volcán">
</a>
<div class="nav-links">
<a class="nav-link" href="InicioPagina.html">Volver al sitio</a>
<a class="nav-link" href="Login.html">Iniciar sesión</a>
</div>
</nav>
</header>
<main class="container">
<section class="page-heading">
<p class="eyebrow">Registro de usuario</p>
<h1>Crea tu cuenta.</h1>
<p>Completa tus datos para recibir una atención más rápida.</p>
</section>
<form id="user-form" class="form-card" novalidate>
<div class="form-row">
<div>
<label for="run">RUN *</label>
<input id="run" name="run" placeholder="12345678K" required>
</div>
<div>
<label for="user-type">Tipo de usuario</label>
<select id="user-type" name="user-type">
<option>Cliente</option>
<option>Administrador</option>
</select>
</div>
</div>
<div class="form-row">
<div>
<label for="name">Nombre *</label>
<input id="name" name="name" maxlength="50" required>
</div>
<div>
<label for="lastname">Apellidos *</label>
<input id="lastname" name="lastname" maxlength="100" required>
</div>
</div>
<div class="form-row">
<div>
<label for="email">Correo electrónico *</label>
<input id="email" name="email" type="email" maxlength="100" required>
</div>
<div>
<label for="birthdate">Fecha de nacimiento</label>
<input id="birthdate" name="birthdate" type="date">
</div>
</div>
<label for="password">Contraseña *</label>
<input id="password" name="password" type="password" minlength="4" maxlength="10" required>
<div class="form-row">
<div>
<label for="region">Región *</label>
<select id="region" name="region" required>
<option value="">Selecciona una región</option>
</select>
</div>
<div>
<label for="commune">Comuna *</label>
<select id="commune" name="commune" required>
<option value="">Selecciona una comuna</option>
</select>
</div>
</div>
<label for="address">Dirección *</label>
<input id="address" name="address" maxlength="300" required>
<button class="button button-primary" type="submit">Registrar usuario</button>
<p class="form-message" aria-live="polite">
</p>
</form>
</main>
<script src="../js/LogicaPaginaGEV.js">
</script>
</body>
</html>
