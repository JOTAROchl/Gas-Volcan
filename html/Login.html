<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso | Gas El Volcán</title>
<link rel="stylesheet" href="../css/EstiloPaginaGEV.css">
</head>
<body>
<header class="site-header">
<nav class="navbar container">
<a class="brand" href="InicioPagina.html">
<img src="../img/logoMasNombreGEV.jpg" alt="Gas El Volcán">
</a>
<div class="nav-links">
<a class="nav-link" href="InicioPagina.html">Volver al sitio</a>
<a class="nav-link" href="Registro.html">Crear usuario</a>
</div>
</nav>
</header>
<main class="container">
<section class="page-heading">
<p class="eyebrow">Acceso seguro</p>
<h1>Ingresa a tu cuenta.</h1>
</section>
<section class="content-grid">
<form id="login-form" class="form-card" novalidate>
<label for="email">Correo electrónico *</label>
<input id="email" name="email" type="email" maxlength="100" required>
<label for="password">Contraseña *</label>
<input id="password" name="password" type="password" minlength="8" maxlength="1000" required>
<button class="button button-primary" type="submit">Iniciar sesión</button>
<p class="form-message" aria-live="polite">
</p>
<p>¿Aún no tienes cuenta? <a class="text-link" href="Registro.html">Regístrate aquí</a>
</p>
</form>
<aside class="form-card">
<p class="eyebrow">Roles</p>
<h2>Dos niveles de acceso</h2>
<p>
<strong>Cliente:</strong> catálogo, selección y contacto.</p>
<p>
<strong>Administrador:</strong> gestión de contenido y usuarios.</p>
<a class="button button-secondary" href="admin.html">Ver área administrativa demo</a>
</aside>
</section>
</main>
<script src="../js/LogicaPaginaGEV.js">
</script>
</body>
</html>
